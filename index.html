<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กิจกรรมเด็กเทพฯ ยุคใหม่ ของหายแล้วได้คืน</title>
  <meta name="description" content="บันทึกความดีนักเรียนที่เก็บของได้ และค้นหาของหายเพื่อรับคืน กลุ่มกิจการนักเรียน โรงเรียนเทพศิรินทร์พุแค สระบุรี">

  <!-- โลโก้บนแท็บเบราว์เซอร์ และไอคอนเมื่อกด "เพิ่มไปยังหน้าจอหลัก" บนมือถือ
       นำไฟล์โลโก้โรงเรียนชื่อ logo.png (แนะนำรูปสี่เหลี่ยมจัตุรัส 512x512 พิกเซล) ไว้ในโฟลเดอร์เดียวกับไฟล์นี้ -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="application-name" content="ของหายได้คืน">
  <meta name="apple-mobile-web-app-title" content="ของหายได้คืน">
  <meta name="theme-color" content="#ffffff">

  <!-- ตัวอย่างลิงก์เวลาแชร์ใน LINE / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="กิจกรรมเด็กเทพฯ ยุคใหม่ ของหายแล้วได้คืน">
  <meta property="og:description" content="บันทึกความดีนักเรียนที่เก็บของได้ และค้นหาของหายเพื่อรับคืน โรงเรียนเทพศิรินทร์พุแค สระบุรี">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --ink: #1B2A3A; --ink-soft: #46566B; --muted: #5B6A7F; --primary: #1C56D4; --green: #1F7A4D; --marigold: #F4B41A; --line: #D6DDE7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; }
    body { font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; color: var(--ink); overflow: hidden; }

    /* ระบบจริง (Google Apps Script) แสดงเต็มหน้าจอ */
    #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; background: #fff; }

    /* หน้าเปิดระหว่างรอ Apps Script โหลด (ปกติ 2-5 วินาที) */
    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: 24px; text-align: center; background: #fff; transition: opacity .3s ease, visibility .3s; }
    #splash::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
      background: linear-gradient(90deg, var(--primary) 0 70%, var(--green) 70% 88%, var(--marigold) 88% 100%); }
    #splash.is-done { opacity: 0; visibility: hidden; }
    .logo { width: 88px; height: 88px; object-fit: contain; margin-bottom: 14px; }
    .mark { display: block; width: 70px; height: 88px; margin-bottom: 14px; }
    [hidden] { display: none !important; }
    .name { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35; max-width: 22em; }
    .name span { display: inline-block; white-space: nowrap; } /* ตัดบรรทัดเป็นวลี ไม่ให้คำว่า "คืน" ตกบรรทัดเดี่ยว */
    .sub { margin: 0; font-size: 14px; color: var(--muted); }
    .bar { position: relative; width: 160px; height: 4px; margin: 26px 0 10px; border-radius: 4px; background: #E6ECF4; overflow: hidden; }
    .bar span { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px; background: var(--primary); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }
    .hint { margin: 0; font-size: 14px; color: var(--ink-soft); min-height: 1.5em; }
    .direct { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 14px; padding: 0 20px; border-radius: 12px;
      background: var(--primary); color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; }
    .direct:hover { background: #1443A8; }
    .direct:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(28, 86, 212, .35); }
    .direct[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .bar span { animation: none; left: 30%; } #splash { transition: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img id="splash-logo" class="logo" src="logo.png" alt="">
    <!-- เครื่องหมายสำรอง ใช้เมื่อยังไม่ได้ใส่ไฟล์ logo.png -->
    <span id="splash-mark" hidden><svg class="mark" viewBox="0 0 30 38" aria-hidden="true">
      <path d="M4 1h22a3 3 0 0 1 3 3v26.5L15 37 1 30.5V4a3 3 0 0 1 3-3z" fill="#F4B41A"/>
      <circle cx="15" cy="9" r="3.4" fill="#fff" stroke="#1B2A3A" stroke-width="1.6"/>
      <path d="M9 20.5l4 4 8-8.5" fill="none" stroke="#1B2A3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg></span>
    <p class="name"><span>กิจกรรมเด็กเทพฯ ยุคใหม่</span> <span>ของหายแล้วได้คืน</span></p>
    <p class="sub">กลุ่มกิจการนักเรียน โรงเรียนเทพศิรินทร์พุแค สระบุรี</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p id="splash-hint" class="hint">กำลังเปิดระบบ...</p>
    <a id="open-direct" class="direct" target="_blank" rel="noopener" hidden>เปิดระบบในหน้าต่างใหม่</a>
  </div>

  <iframe id="app" title="กิจกรรมเด็กเทพฯ ยุคใหม่ ของหายแล้วได้คืน" allow="camera; clipboard-write; fullscreen"></iframe>

  <noscript>
    <p style="position:fixed;inset:auto 0 24px;z-index:20;text-align:center">กรุณาเปิดใช้ JavaScript ในเบราว์เซอร์เพื่อใช้งานระบบ</p>
  </noscript>

  <script>
    // ==========================================================
    // ตั้งค่า: วางลิงก์เว็บแอป Google Apps Script (ลงท้ายด้วย /exec) ระหว่างเครื่องหมายคำพูด
    // หาได้จาก Apps Script > Deploy (การทำให้ใช้งานได้) > Manage deployments > Web app URL
    // ==========================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFgxFU0wFttjh0e8htGdg8vi1Qd7zQ3W-HabxF1caYQMZqTfcVmYsF2ZrsNAB-UL6i/exec";

    const SLOW_AFTER_MS = 15000; // โหลดเกินเวลานี้ แสดงปุ่มเปิดในหน้าต่างใหม่

    (function () {
      const splash = document.getElementById("splash");
      const hint = document.getElementById("splash-hint");
      const direct = document.getElementById("open-direct");
      const frame = document.getElementById("app");
      const logo = document.getElementById("splash-logo");

      // ยังไม่มีไฟล์ logo.png: ใช้เครื่องหมายของระบบแทน (ตรวจทั้งกรณีที่โหลดไม่สำเร็จไปแล้วก่อนสคริปต์นี้ทำงาน)
      const useMark = function () {
        logo.hidden = true;
        document.getElementById("splash-mark").hidden = false;
      };
      if (logo.complete && logo.naturalWidth === 0) useMark();
      else logo.addEventListener("error", useMark);

      const validUrl = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]{20,}\/exec\/?(\?.*)?$/.test(WEB_APP_URL);
      if (!validUrl) {
        document.querySelector(".bar").hidden = true;
        hint.textContent = "ยังไม่ได้ตั้งลิงก์เว็บแอป: ผู้ดูแลกรุณาแก้ค่า WEB_APP_URL ในไฟล์ index.html";
        return;
      }

      direct.href = WEB_APP_URL;
      let loaded = false;
      frame.addEventListener("load", function () {
        if (!frame.getAttribute("src")) return;
        loaded = true;
        splash.classList.add("is-done");
        splash.setAttribute("aria-hidden", "true");
        try { frame.focus(); } catch (e) {}
      });
      frame.src = WEB_APP_URL;

      setTimeout(function () {
        if (loaded) return;
        hint.textContent = "ใช้เวลานานกว่าปกติ ถ้าหน้าเว็บไม่ขึ้น กดปุ่มด้านล่างเพื่อเปิดระบบโดยตรง";
        direct.hidden = false;
      }, SLOW_AFTER_MS);
    })();
  </script>
</body>
</html>
